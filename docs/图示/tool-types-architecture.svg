<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-label="ToolTypes 简明关系图">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="960" height="640" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="480" y="48" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#111827">ToolTypes 做什么</text>
  <text x="480" y="74" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#6b7280">只描述工具调用的数据，不执行工具</text>

  <!-- ═══ 主链路：4 个阶段 ═══ -->
  <!-- 1 Spec -->
  <rect x="48" y="120" width="190" height="120" rx="12" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="143" y="152" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#9ca3af">1 · 定义</text>
  <text x="143" y="182" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#111827">ToolSpec</text>
  <text x="143" y="208" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#6b7280">工具说明书</text>
  <text x="143" y="226" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#9ca3af">名字 · 参数 Schema</text>

  <path d="M 238 180 L 278 180" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/>

  <!-- 2 Call -->
  <rect x="280" y="120" width="190" height="120" rx="12" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="375" y="152" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#9ca3af">2 · 调用</text>
  <text x="375" y="182" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#111827">ToolCall</text>
  <text x="375" y="208" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#6b7280">模型要执行什么</text>
  <text x="375" y="226" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#9ca3af">id · 工具名 · 参数</text>

  <path d="M 470 180 L 510 180" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/>

  <!-- 3 Approval (optional) -->
  <rect x="512" y="120" width="190" height="120" rx="12" fill="#fff" stroke="#e5e7eb" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="607" y="152" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#9ca3af">3 · 审批（可选）</text>
  <text x="607" y="178" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#6b7280">Pending</text>
  <text x="607" y="198" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#6b7280">ApprovalRequest</text>
  <text x="607" y="226" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#9ca3af">写文件 / 跑命令时</text>

  <path d="M 702 180 L 742 180" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/>

  <!-- 4 Result -->
  <rect x="744" y="120" width="180" height="120" rx="12" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="834" y="152" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#9ca3af">4 · 结果</text>
  <text x="834" y="182" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#111827">ToolResult</text>
  <text x="834" y="208" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#6b7280">执行回执</text>
  <text x="834" y="226" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#9ca3af">成功 / 失败 / 文本</text>

  <!-- ═══ 谁产生、谁消费 ═══ -->
  <text x="480" y="300" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#111827">和周围模块的关系</text>

  <!-- 三列：模型 / ToolTypes / 执行与UI -->
  <rect x="48" y="328" width="260" height="180" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="178" y="360" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">模型侧</text>
  <text x="178" y="392" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#374151">读 ToolSpec → 知道有哪些工具</text>
  <text x="178" y="418" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#374151">产出 ToolCall</text>
  <text x="178" y="444" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#374151">再吃回 ToolResult</text>
  <text x="178" y="478" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#6b7280">via ProviderTypes</text>

  <rect x="350" y="328" width="260" height="180" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="480" y="360" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#c2410c">ToolTypes（本文件）</text>
  <text x="480" y="398" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#374151">只放数据结构</text>
  <text x="480" y="428" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#9a3412">Spec · Call · Result</text>
  <text x="480" y="454" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#9a3412">Approval · Builder</text>
  <text x="480" y="486" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#6b7280">不跑代码、不连网络</text>

  <rect x="652" y="328" width="260" height="180" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="782" y="360" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#15803d">执行与界面</text>
  <text x="782" y="392" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#374151">Runtime 执行 ToolCall</text>
  <text x="782" y="418" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#374151">产出 ToolResult</text>
  <text x="782" y="444" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#374151">UI 处理审批与展示</text>
  <text x="782" y="478" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">尚未实现</text>

  <!-- 左右箭头指向中间 -->
  <path d="M 308 418 L 348 418" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M 652 418 L 612 418" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 底部一句话 -->
  <text x="480" y="560" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#374151">
    <tspan font-weight="700">ToolTypes</tspan> = 工具世界的「名词」
  </text>
  <text x="480" y="588" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#6b7280">
    ProviderTypes = 怎么把这些名词翻译给模型
  </text>
  <text x="480" y="614" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#6b7280">
    Runtime / UI = 真正干活和给人看
  </text>
</svg>
